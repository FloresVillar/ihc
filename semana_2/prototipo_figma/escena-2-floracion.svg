<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#1B211E"/>

  <text x="32" y="48" font-size="20" font-weight="600" fill="#ECEFEC">2. Estado de floración de una obra</text>

  <!-- anillos de pulso (arousal) -->
  <g fill="none" stroke="#73D99A" stroke-width="1.5">
    <circle cx="450" cy="330" r="150" opacity="0.12"/>
    <circle cx="450" cy="330" r="190" opacity="0.08"/>
    <circle cx="450" cy="330" r="230" opacity="0.05"/>
  </g>

  <!-- obra en floración plena -->
  <g>
    <circle cx="450" cy="330" r="128" fill="#73D99A" opacity="0.18"/>
    <rect x="432" y="225" width="36" height="210" rx="14" fill="#73D99A" opacity="0.5"/>
    <rect x="345" y="312" width="210" height="36" rx="14" fill="#73D99A" opacity="0.5"/>
    <circle cx="450" cy="330" r="70" fill="#73D99A"/>
  </g>

  <text x="450" y="470" font-size="14" fill="#A9B0AC" text-anchor="middle">Color / bioluminiscencia = valencia · Ritmo del pulso = arousal · Densidad = tensión</text>

  <!-- leyenda de los 3 estados -->
  <line x1="32" y1="530" x2="868" y2="530" stroke="#3A433D" stroke-width="1"/>
  <text x="32" y="556" font-size="13" font-weight="600" fill="#ECEFEC">Estados posibles de una obra</text>

  <!-- semi-brote: núcleo pequeño y difuso, sin pétalos -->
  <g>
    <circle cx="90" cy="600" r="20" fill="#8FA79A" opacity="0.28"/>
    <circle cx="90" cy="600" r="9" fill="#8FA79A" opacity="0.65"/>
    <text x="125" y="605" font-size="12" fill="#A9B0AC">Semi-brote (ambiguo)</text>
  </g>

  <!-- floración: núcleo pleno con pétalos visibles -->
  <g>
    <circle cx="380" cy="600" r="24" fill="#73D99A" opacity="0.3"/>
    <rect x="376" y="576" width="8" height="20" rx="3" fill="#73D99A" opacity="0.6"/>
    <rect x="360" y="592" width="20" height="8" rx="3" fill="#73D99A" opacity="0.6"/>
    <rect x="380" y="592" width="20" height="8" rx="3" fill="#73D99A" opacity="0.6"/>
    <circle cx="380" cy="600" r="10" fill="#73D99A"/>
    <text x="415" y="605" font-size="12" fill="#A9B0AC">Floración (positivo)</text>
  </g>

  <!-- marchitamiento: núcleo apagado, pétalos caídos/tenues -->
  <g>
    <rect x="647" y="600" width="6" height="16" rx="3" fill="#4A5650" transform="rotate(30 650 600)"/>
    <rect x="647" y="600" width="6" height="16" rx="3" fill="#4A5650" transform="rotate(-30 650 600)"/>
    <circle cx="650" cy="600" r="9" fill="#4A5650"/>
    <text x="685" y="605" font-size="12" fill="#A9B0AC">Marchitamiento (decae)</text>
  </g>
</svg>
